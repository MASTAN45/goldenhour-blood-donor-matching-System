spring.application.name=lifelink
server.port=8080

# Database (MySQL, local defaults; override with environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifelink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:lifelink}
spring.datasource.password=${DB_PASSWORD:LifeLink@123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis (optional, not required for the demo)
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false
management.health.mail.enabled=false

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-change-in-production-environment-use-environment-variable}
jwt.expiration=86400000
jwt.refresh-expiration=2592000000

# Mail (mock for now)
spring.mail.host=localhost
spring.mail.port=1025

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# GoldenHour settings
lifelink.expiry.critical-hours=6
lifelink.expiry.urgent-hours=24
lifelink.expiry.routine-hours=168
lifelink.matching.waves=5,10,25
lifelink.matching.wave-interval-minutes=2
lifelink.matching.tick-ms=15000
cors.origins=http://localhost:5173

# IST, hospital demo mode, geocoder identity
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
lifelink.hospital.auto-verify=${HOSPITAL_AUTO_VERIFY:true}
lifelink.geo.user-agent=${GEO_USER_AGENT:GoldenHour-Demo/1.0}lifelink.seed.enabled=${SEED_ENABLED:true}
lifelink.admin.email=${ADMIN_EMAIL:}
lifelink.admin.password=${ADMIN_PASSWORD:}
