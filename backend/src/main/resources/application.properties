spring.application.name=lifelink
server.port=8080

# Database (MySQL, local defaults; override with environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifelink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:lifelink}
spring.datasource.password=${DB_PASSWORD:LifeLink@123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis (optional, not required for the demo)
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false
management.health.mail.enabled=false

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-change-in-production-environment-use-environment-variable}
jwt.expiration=86400000
jwt.refresh-expiration=2592000000

# Mail (mock for now)
spring.mail.host=localhost
spring.mail.port=1025

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
