spring.application.name=lifelink
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/lifelink?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=your-secret-key-min-256-bits-change-in-production-environment-use-environment-variable
jwt.expiration=86400000
jwt.refresh-expiration=2592000000

# Mail (mock for now)
spring.mail.host=localhost
spring.mail.port=1025

# Actuator
management.endpoints.web.exposure.include=health,info,metrics